services:
  - type: web
    name: music-journal
    runtime: node
    plan: starter
    region: frankfurt
    branch: trunk
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 15
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: DB_NAME
        value: music-journal
      - key: COOKIE_SAMESITE
        value: lax
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
